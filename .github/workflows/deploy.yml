name: Deploy server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peper24-production-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: peper24_test
          MYSQL_USER: peper24
          MYSQL_PASSWORD: peper24_dev
          MYSQL_ROOT_PASSWORD: peper24_root_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppeper24_root_dev --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping | grep -q PONG"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Verify
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test:unit
          pnpm test:integration

      - name: Package source
        run: |
          tar -czf "/tmp/peper24-server-${GITHUB_SHA}.tar.gz" \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=logs \
            --exclude=coverage \
            --exclude=.env \
            --exclude='.env.*' \
            --exclude=backups \
            --exclude='database/backups' \
            --exclude='._*' \
            .

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/id_ed25519 | awk '{print $2}')" = \
            "SHA256:DfSZhAtSNphJWJ4gZ61MptrrPZX2448M9gXqrROxj6o"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          archive="/tmp/peper24-server-${GITHUB_SHA}.tar.gz"
          remote_archive="/tmp/peper24-server-${GITHUB_SHA}.tar.gz"
          scp -o BatchMode=yes "$archive" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/deploy-peper24-server '${remote_archive}' '${GITHUB_SHA}'"
