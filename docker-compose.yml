services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: peper24
      MYSQL_USER: peper24
      MYSQL_PASSWORD: peper24_dev
      MYSQL_ROOT_PASSWORD: peper24_root_dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - peper24_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-upeper24", "-ppeper24_dev" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - peper24_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  peper24_mysql_data:
  peper24_redis_data:
