<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>语法 Prompt Benchmark 报告</title>
  <style>
    :root { color-scheme: light; --ink: #172033; --muted: #667085; --line: #e5e7eb; --bg: #f4f7fb; --card: #fff; --good: #067647; --bad: #b42318; --accent: #3157d5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 Inter, ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 1240px; margin: 0 auto; padding: 36px 24px 72px; }
    h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -.02em; }
    h2 { margin: 34px 0 14px; font-size: 20px; }
    .muted { color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 22px; }
    .card, .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 28px rgba(16, 24, 40, .05); }
    .card { padding: 18px; }
    .card.has-failures { border-color: #fda29b; background: #fffbfa; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .card h3 { margin: 0; font-size: 15px; }
    .score { font-size: 28px; font-weight: 750; }
    .rate { margin-top: 2px; font-size: 15px; font-weight: 650; }
    .good { color: var(--good); } .bad { color: var(--bad); }
    .status { flex: none; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .status.pass { background: #dcfae6; color: var(--good); }
    .status.fail { background: #fee4e2; color: var(--bad); }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 12px; color: var(--muted); }
    .tabs { display: flex; gap: 8px; margin: 0 0 12px; overflow-x: auto; padding-bottom: 2px; }
    .tab { appearance: none; border: 1px solid #d0d5dd; background: #fff; color: #475467; border-radius: 9px; padding: 8px 13px; cursor: pointer; font: inherit; font-weight: 650; white-space: nowrap; }
    .tab:hover { border-color: #98a2b3; }
    .tab.active { border-color: var(--accent); background: #eef2ff; color: #293f9d; box-shadow: 0 0 0 2px rgba(49, 87, 213, .1); }
    .panel { overflow: hidden; }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 11px 13px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: #f8fafc; color: #475467; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    tr:last-child td { border-bottom: 0; }
    tr.has-failures td { background: #fffbfa; }
    .result-count { font-weight: 700; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    code { background: #eef2ff; color: #293f9d; border-radius: 5px; padding: 2px 5px; }
    details { margin: 8px 0; }
    summary { cursor: pointer; color: var(--accent); font-weight: 650; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #101828; color: #e4e7ec; border-radius: 10px; padding: 12px; font-size: 12px; }
    .tag { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 7px; border-radius: 999px; background: #fee4e2; color: var(--bad); font-size: 12px; }
    .empty { padding: 22px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>语法 Prompt Benchmark</h1>
    <div class="muted" id="subtitle"></div>
    <section class="cards" id="summaryCards"></section>

    <h2>逐 Case 结果</h2>
    <nav class="tabs" id="variantTabs" aria-label="结果分组"></nav>
    <section class="panel scroll"><table><thead><tr><th>Case</th><th>正确</th><th>正确率</th><th>平均</th><th>p50</th><th>p95</th><th>最大</th></tr></thead><tbody id="caseRows"></tbody></table></section>

    <h2>错误 Case 与原因分析</h2>
    <section class="panel" id="failures"></section>

    <h2>异常慢 Case</h2>
    <section class="panel" id="slowCases"></section>
  </main>
  <script type="application/json" id="benchmarkData">__BENCHMARK_DATA__</script>
  <script>
    const data = JSON.parse(document.getElementById('benchmarkData').textContent);
    const report = data.report;
    const pct = value => `${(value * 100).toFixed(1)}%`;
    const ms = value => value == null ? '—' : `${value} ms`;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    document.getElementById('subtitle').textContent = `${data.targets.map(item => item.modelId).join(' / ')} · ${data.runs} 轮 · ${report.totals.calls} 次请求 · ${new Date(report.generatedAt).toLocaleString()}`;
    document.getElementById('summaryCards').innerHTML = data.summary.map(item => {
      const complete = item.passed === item.total;
      return `
      <article class="card ${complete ? '' : 'has-failures'}">
        <div class="card-head"><h3>${esc(item.id)}</h3><span class="status ${complete ? 'pass' : 'fail'}">${complete ? '全部正确' : '未全通过'}</span></div>
        <div class="score ${complete ? 'good' : 'bad'}">正确 ${item.passed}/${item.total}</div>
        <div class="rate ${complete ? 'good' : 'bad'}">正确率 ${pct(item.passRate)}</div>
        <div class="meta"><span>调用成功 ${pct(item.callSuccessRate)}</span><span>平均 ${ms(item.averageMs)}</span><span>p50 ${ms(item.p50Ms)}</span><span>p95 ${ms(item.p95Ms)}</span><span>输入 ${item.averageInputTokens} tokens</span><span>输出 ${item.averageOutputTokens} tokens</span></div>
      </article>`;
    }).join('');

    let activeVariant = data.summary[0]?.id;
    const tabs = document.getElementById('variantTabs');
    tabs.innerHTML = data.summary.map((item, index) => `<button class="tab ${index === 0 ? 'active' : ''}" type="button" data-index="${index}" aria-selected="${index === 0}">${esc(item.id)} · ${item.passed}/${item.total}</button>`).join('');
    tabs.addEventListener('click', event => {
      const button = event.target.closest('[data-index]');
      if (!button) return;
      activeVariant = data.summary[Number(button.dataset.index)].id;
      for (const tab of tabs.querySelectorAll('.tab')) {
        const active = tab === button;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', String(active));
      }
      renderActiveGroup();
    });

    const failures = document.getElementById('failures');
    const slow = document.getElementById('slowCases');

    function renderActiveGroup() {
      const caseRows = report.caseSummaries.filter(item => item.variant === activeVariant);
      document.getElementById('caseRows').innerHTML = caseRows.map(item => {
        const complete = item.passed === item.total;
        return `<tr class="${complete ? '' : 'has-failures'}"><td>${esc(item.caseId)}<div class="muted">${esc(item.description)}</div></td><td class="result-count ${complete ? 'good' : 'bad'}">${item.passed}/${item.total}</td><td class="${complete ? 'good' : 'bad'}">${pct(item.passRate)}${complete ? '' : ' · 未全通过'}</td><td>${ms(item.averageMs)}</td><td>${ms(item.p50Ms)}</td><td>${ms(item.p95Ms)}</td><td>${ms(item.maxMs)}</td></tr>`;
      }).join('');

      const groupFailures = report.failureCases.filter(item => item.variant === activeVariant);
      failures.innerHTML = groupFailures.length ? `<div class="scroll"><table><thead><tr><th>Case</th><th>失败</th><th>输入</th><th>原因分析</th><th>逐次结果</th></tr></thead><tbody>${groupFailures.map(item => `
        <tr><td>${esc(item.caseId)}<div class="muted">${esc(item.description)}</div></td><td class="bad result-count">${item.failed}/${item.total}<br>${pct(item.failureRate)}</td><td>${esc(item.input)}</td><td>${item.categories.map(value => `<span class="tag">${esc(value)}</span>`).join('')}</td><td>${item.failures.map(run => `<details><summary>第 ${run.run} 轮 · ${ms(run.durationMs)}</summary><div>${run.errors.map(value => `<div>• ${esc(value)}</div>`).join('')}</div><pre>${esc(JSON.stringify(run.output, null, 2))}</pre></details>`).join('')}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><code>${esc(activeVariant)}</code> 全部业务断言通过。</div>`;

      const groupSlowCases = report.slowCases.filter(item => item.variant === activeVariant);
      slow.innerHTML = groupSlowCases.length ? `<div class="scroll"><table><thead><tr><th>Case</th><th>平均</th><th>p95</th><th>相对总体</th></tr></thead><tbody>${groupSlowCases.map(item => `<tr><td>${esc(item.caseId)}</td><td>${ms(item.averageMs)}</td><td>${ms(item.p95Ms)}</td><td>平均 ${item.averageRatio.toFixed(2)}× / p95 ${item.p95Ratio.toFixed(2)}×</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><code>${esc(activeVariant)}</code> 未发现达到 ${report.slowRatio.toFixed(2)}× 阈值的 case。</div>`;
    }

    renderActiveGroup();
  </script>
</body>
</html>
